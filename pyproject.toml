[project]
name = "retrieval-eval"
version = "0.1.0"
description = "BM25 vs dense vs hybrid retrieval on BEIR, with metrics validated against published numbers and per-query failure analysis"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
